<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Minha Cartinha ♡</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      background: #111;
      color: white;
      font-family: Arial, sans-serif;
      text-align: center;
      padding: 20px;
    }

    .card {
      width: min(420px, 100%);
      padding: 30px 20px;
      border: 2px solid #ff8fb3;
      border-radius: 20px;
      background: #1b1b1b;
      box-shadow: 0 0 25px rgba(255, 143, 179, 0.25);
    }

    h1 {
      margin-top: 0;
      color: #ff9fbd;
    }

    .heart {
      font-size: 70px;
      margin: 20px 0;
      animation: pulse 1.2s infinite;
    }

    button {
      border: 0;
      border-radius: 12px;
      padding: 12px 24px;
      margin: 6px;
      font-size: 18px;
      cursor: pointer;
    }

    #yes {
      background: #ff6f9f;
      color: white;
    }

    #no {
      background: #333;
      color: white;
    }

    #result {
      margin-top: 20px;
      font-size: 20px;
      color: #ffb6cc;
    }

    @keyframes pulse {
      50% {
        transform: scale(1.15);
      }
    }
  </style>
</head>

<body>
  <main class="card">
    <h1>Ei, você!<br>Você me ama ♡?</h1>

    <div class="heart">♡</div>

    <button id="yes">SIM</button>
    <button id="no">NÃO</button>

    <p id="result"></p>
  </main>

  <script>
    const yes = document.getElementById("yes");
    const no = document.getElementById("no");
    const result = document.getElementById("result");

    yes.addEventListener("click", () => {
      result.innerHTML = "EBAAAAAA! ♡<br>Eu sabia! 🤍";
    });

    no.addEventListener("click", () => {
      result.textContent = "Hmmmm... tenta de novo 😼";
    });
  </script>
</body>
</html>
